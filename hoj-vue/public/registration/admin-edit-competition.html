<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑比赛 - 报名系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- Element Plus -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <!-- Markdown 支持 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #2d3748;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 32px;
            clear: both;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        /* 确保datetime-local输入框的图标区域也可以点击 */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            padding: 4px;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 0.7;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-item:hover {
            background: #edf2f7;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        /* Markdown 编辑器样式 */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 500px;
            margin-bottom: 16px;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .editor-panel label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            flex-shrink: 0;
        }

        .markdown-editor {
            flex: 1;
            min-height: 0;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: #f7fafc;
            transition: all 0.3s;
        }

        .markdown-editor:focus {
            outline: none;
            border-color: #4facfe;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .preview-panel label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            flex-shrink: 0;
        }

        .markdown-preview {
            flex: 1;
            min-height: 0;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            overflow-y: auto;
            background: white;
        }

        /* Markdown 内容样式 */
        .markdown-content h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .markdown-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 18px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
        }

        .markdown-content h3 {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0 8px;
        }

        .markdown-content p {
            margin: 12px 0;
            line-height: 1.7;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin: 6px 0;
        }

        .markdown-content code {
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #e53e3e;
        }

        .markdown-content pre {
            background: #2d3748;
            color: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .markdown-content pre code {
            background: transparent;
            color: #f7fafc;
            padding: 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid #4facfe;
            padding-left: 16px;
            margin: 12px 0;
            color: #718096;
            font-style: italic;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .markdown-content img:hover {
            transform: scale(1.02);
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }

        .markdown-content table th,
        .markdown-content table td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-content table th {
            background: #f7fafc;
            font-weight: 600;
        }

        .markdown-content a {
            color: #4facfe;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .image-size-btn {
            padding: 8px 16px;
            font-size: 13px;
            background: white;
            border: 1px solid #4facfe;
            color: #4facfe;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .image-size-btn:hover {
            background: #4facfe;
            color: white;
        }

        .upload-progress {
            margin-top: 12px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
        }

        @media (max-width: 1024px) {
            .editor-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .editor-panel,
            .preview-panel {
                min-height: 300px;
            }

            .markdown-editor,
            .markdown-preview {
                min-height: 250px;
            }
        }

        @media (max-width: 768px) {
            .markdown-editor,
            .markdown-preview {
                min-height: 200px;
            }

            .checkbox-group {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <a href="admin.html" class="back-link">← 返回管理后台</a>

            <div class="header">
                <h1>✏️ 编辑比赛</h1>
                <p>修改比赛信息和详细说明</p>
            </div>

            <div class="card" v-if="competition.id">
                <form @submit.prevent="saveCompetition">
                    <div class="form-group">
                        <label>📌 比赛名称</label>
                        <input type="text" v-model="competition.name" required>
                    </div>

                    <div class="form-group">
                        <label>📅 报名开始时间</label>
                        <el-date-picker
                            v-model="competition.startTime"
                            type="datetime"
                            placeholder="选择报名开始时间"
                            format="YYYY-MM-DD HH:mm:ss"
                            value-format="YYYY-MM-DD HH:mm:ss"
                            :editable="false"
                            style="width: 100%">
                        </el-date-picker>
                    </div>

                    <div class="form-group">
                        <label>📅 报名结束时间</label>
                        <el-date-picker
                            v-model="competition.endTime"
                            type="datetime"
                            placeholder="选择报名结束时间"
                            format="YYYY-MM-DD HH:mm:ss"
                            value-format="YYYY-MM-DD HH:mm:ss"
                            :editable="false"
                            style="width: 100%">
                        </el-date-picker>
                    </div>

                    <div class="form-group">
                        <label>🖼️ 比赛Logo</label>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <button type="button" class="image-size-btn" @click="triggerLogoUpload">📤 上传Logo</button>
                            <input type="file" @change="handleLogoUpload" accept="image/*" ref="logoInput" style="display: none;">
                            <span v-if="logoFileName" style="font-size: 14px; color: #718096;">{{ logoFileName }}</span>
                        </div>
                        <div v-if="competition.logoUrl" style="margin-top: 12px;">
                            <img :src="getLogoUrl(competition.logoUrl)" alt="Logo预览" style="width: 100px; height: 100px; object-fit: contain; border-radius: 8px; border: 2px solid #e2e8f0;">
                        </div>
                        <div v-if="uploadProgress > 0 && uploadProgress < 100" class="upload-progress">
                            <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;">
                                <div :style="{width: uploadProgress + '%', background: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', height: '100%', transition: 'width 0.3s'}"></div>
                            </div>
                            <p style="font-size: 12px; color: #718096; margin-top: 4px;">上传中... {{ uploadProgress }}%</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>📄 比赛说明（支持 Markdown）</label>
                        <div class="editor-container">
                            <div class="editor-panel">
                                <label>✏️ 编辑</label>
                                <textarea
                                    class="markdown-editor"
                                    v-model="competition.description"
                                    @input="updatePreview"
                                    placeholder="请输入比赛说明（支持 Markdown 语法）...&#10;&#10;# 一级标题&#10;## 二级标题&#10;**粗体** *斜体*&#10;- 列表项&#10;[链接](url)&#10;![图片](url)&#10;&#10;```&#10;代码块&#10;```"
                                ></textarea>
                            </div>
                            <div class="preview-panel">
                                <label>👁️ 预览</label>
                                <div class="markdown-preview markdown-content" v-html="preview"></div>
                            </div>
                        </div>
                        <div style="margin-top: 12px;">
                            <button type="button" class="image-size-btn" @click="uploadAndInsertImage">📤 上传图片</button>
                        </div>
                        <p style="font-size: 12px; color: #718096; margin-top: 8px;">支持 Markdown 语法。上传图片后会自动插入为中等尺寸。</p>
                    </div>

                    <div class="form-group">
                        <label>📝 需要收集的信息字段</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item" v-for="(label, field) in fieldOptions" :key="field">
                                <input type="checkbox" v-model="competition.fields[field]">
                                <span>{{ label }}</span>
                            </label>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">💾 保存修改</button>
                        <button type="button" class="btn btn-secondary" @click="cancel">取消</button>
                    </div>
                </form>
            </div>

            <div v-else class="card">
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    competitionId: null,
                    competition: {
                        name: '',
                        startTime: '',
                        endTime: '',
                        logoUrl: '',
                        description: '',
                        fields: {}
                    },
                    fieldOptions: {
                        name: '👤 姓名',
                        class: '🏫 班级',
                        college: '🎓 学院',
                        student_id: '🆔 学号',
                        gender: '⚧️ 性别',
                        shirt_size: '👕 衬衫大小',
                        team_name: '👥 队伍名称',
                        qq: '💬 联系方式QQ'
                    },
                    logoFileName: '',
                    uploadProgress: 0,
                    preview: ''
                }
            },
            methods: {
                async loadCompetition() {
                    try {
                        const response = await axios.get(`/registration-api/api/competitions/${this.competitionId}`)
                        const comp = response.data

                        this.competition = {
                            id: comp.id,
                            name: comp.name,
                            startTime: this.formatDateTimeForInput(comp.start_time),
                            endTime: this.formatDateTimeForInput(comp.end_time),
                            logoUrl: comp.logo_url || '',
                            description: comp.description || '',
                            fields: typeof comp.fields === 'string' ? JSON.parse(comp.fields) : {...comp.fields}
                        }

                        // 提取 logo 文件名
                        if (comp.logo_url) {
                            const parts = comp.logo_url.split('/')
                            this.logoFileName = parts[parts.length - 1]
                        }

                        // 初始化预览
                        this.$nextTick(() => {
                            this.updatePreview()
                        })
                    } catch (error) {
                        alert('加载比赛数据失败: ' + error.message)
                        window.location.href = 'admin.html'
                    }
                },
                formatDateTimeForInput(dateStr) {
                    if (!dateStr) return ''
                    const date = new Date(dateStr)
                    date.setMinutes(date.getMinutes() - date.getTimezoneOffset())
                    return date.toISOString().slice(0, 19)
                },
                updatePreview() {
                    this.preview = this.renderMarkdown(this.competition.description)
                },
                renderMarkdown(content) {
                    if (!content) return ''
                    try {
                        // 预处理：将带尺寸的图片直接转换为 HTML
                        let processedContent = content.replace(
                            /!\[([^\]]*)\]\(([^)]+)\)\s*\{\s*width\s*=\s*["']([^"'%]+%?)["']\s*\}/g,
                            (match, alt, url, width) => {
                                const normalizedWidth = width.includes('%') ? width : (width.includes('px') ? width : width + 'px')
                                return `<img src="${url}" alt="${alt}" style="width: ${normalizedWidth}; max-width: 100%; height: auto;">`
                            }
                        )

                        marked.setOptions({
                            breaks: true,
                            gfm: true,
                            highlight: function(code, lang) {
                                if (lang && hljs.getLanguage(lang)) {
                                    try {
                                        return hljs.highlight(code, { language: lang }).value
                                    } catch (err) {}
                                }
                                return hljs.highlightAuto(code).value
                            }
                        })

                        return marked.parse(processedContent)
                    } catch (error) {
                        console.error('Markdown 解析错误:', error)
                        return content
                    }
                },
                async uploadAndInsertImage() {
                    const input = document.createElement('input')
                    input.setAttribute('type', 'file')
                    input.setAttribute('accept', 'image/*')
                    input.click()

                    input.onchange = async () => {
                        const file = input.files[0]
                        if (!file) return

                        const formData = new FormData()
                        formData.append('image', file)

                        try {
                            const response = await axios.post('/registration-api/api/upload/image', formData)
                            const imageUrl = '/registration-api' + response.data.url
                            // 默认插入中等尺寸
                            const imageMd = `![图片](${imageUrl}){ width="600px" }\n`
                            this.competition.description += imageMd
                            this.updatePreview()
                        } catch (error) {
                            console.error('图片上传失败:', error)
                            alert('图片上传失败，请重试')
                        }
                    }
                },
                triggerLogoUpload() {
                    this.$refs.logoInput.click()
                },
                getLogoUrl(url) {
                    if (!url) return ''
                    if (url.startsWith('http://') || url.startsWith('https://')) {
                        return url
                    }
                    return '/registration-api' + url
                },
                async handleLogoUpload(event) {
                    const file = event.target.files[0]
                    if (!file) return

                    const formData = new FormData()
                    formData.append('image', file)

                    try {
                        this.uploadProgress = 0
                        const response = await axios.post('/registration-api/api/upload/image', formData, {
                            onUploadProgress: (progressEvent) => {
                                this.uploadProgress = Math.round((progressEvent.loaded * 100) / progressEvent.total)
                            }
                        })

                        this.competition.logoUrl = response.data.url
                        this.logoFileName = file.name
                        this.uploadProgress = 100

                        setTimeout(() => {
                            this.uploadProgress = 0
                        }, 2000)
                    } catch (error) {
                        alert('Logo 上传失败')
                        console.error(error)
                    }
                },
                async saveCompetition() {
                    try {
                        const payload = {
                            name: this.competition.name,
                            start_time: new Date(this.competition.startTime).toISOString(),
                            end_time: new Date(this.competition.endTime).toISOString(),
                            logo_url: this.competition.logoUrl,
                            description: this.competition.description,
                            fields: JSON.stringify(this.competition.fields)
                        }

                        await axios.put(`/registration-api/api/competitions/${this.competitionId}`, payload)
                        alert('保存成功！')
                        window.location.href = 'admin.html'
                    } catch (error) {
                        alert('保存失败：' + (error.response?.data || error.message))
                    }
                },
                cancel() {
                    if (confirm('确定要取消吗？未保存的修改将丢失。')) {
                        window.location.href = 'admin.html'
                    }
                }
            },
            async mounted() {
                const urlParams = new URLSearchParams(window.location.search)
                this.competitionId = urlParams.get('id')

                if (!this.competitionId) {
                    alert('缺少比赛ID')
                    window.location.href = 'admin.html'
                    return
                }

                await this.loadCompetition()
            }
        }).use(ElementPlus).mount('#app')
    </script>
</body>
</html>
