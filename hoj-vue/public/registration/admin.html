<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名系统 - 管理员</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- Markdown 支持 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #2d3748;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f7fafc;
        }

        .datetime-input-wrapper {
            position: relative;
            cursor: pointer;
        }

        .datetime-input-wrapper input[type="datetime-local"] {
            cursor: pointer;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4facfe;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .checkbox-item {
            display: flex !important;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .checkbox-item:hover {
            background: #edf2f7;
            transform: translateX(4px);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4facfe;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            color: #4a5568;
        }

        button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 172, 254, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        button.success:hover {
            box-shadow: 0 6px 16px rgba(72, 187, 120, 0.5);
        }

        button.danger {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            box-shadow: 0 4px 12px rgba(245, 101, 101, 0.4);
        }

        button.danger:hover {
            box-shadow: 0 6px 16px rgba(245, 101, 101, 0.5);
        }

        button.secondary {
            background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);
            box-shadow: 0 4px 12px rgba(160, 174, 192, 0.4);
        }

        button.secondary:hover {
            box-shadow: 0 6px 16px rgba(160, 174, 192, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        table thead {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
        }

        table tbody tr {
            transition: all 0.2s;
        }

        table tbody tr:hover {
            background: #f7fafc;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .badge.pending {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }

        .badge.approved {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }

        .badge.rejected {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: none;
        }

        .tab:hover {
            background: #cbd5e0;
            transform: translateY(-1px);
        }

        .tab.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }

        .competition-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .competition-item {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .competition-item:hover {
            border-color: #4facfe;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(79, 172, 254, 0.2);
        }

        .competition-item.active {
            border-color: #4facfe;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            box-shadow: 0 8px 16px rgba(79, 172, 254, 0.3);
        }

        .competition-item h3 {
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .competition-item p {
            color: #718096;
            font-size: 13px;
            margin: 4px 0;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 8px 16px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 500;
        }

        .hidden-competition {
            opacity: 0.6;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.pending {
            background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
        }

        .stat-card.approved {
            background: linear-gradient(135deg, #68d391 0%, #48bb78 100%);
        }

        .stat-card.rejected {
            background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Markdown 编辑器样式 */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 创建比赛页面的编辑器高度 */
        #app > .container > .card .editor-container {
            height: 400px;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-panel label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
        }

        .markdown-editor {
            flex: 1;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: #f7fafc;
            transition: all 0.3s;
        }

        .markdown-editor:focus {
            outline: none;
            border-color: #4facfe;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preview-panel label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
        }

        .markdown-preview {
            flex: 1;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            overflow-y: auto;
            background: white;
        }

        /* Markdown 内容样式 */
        .markdown-content h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .markdown-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 18px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
        }

        .markdown-content h3 {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0 8px;
        }

        .markdown-content p {
            margin: 12px 0;
            line-height: 1.7;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin: 6px 0;
        }

        .markdown-content code {
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: #e53e3e;
        }

        .markdown-content pre {
            background: #2d3748;
            color: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .markdown-content pre code {
            background: transparent;
            color: #f7fafc;
            padding: 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid #4facfe;
            padding-left: 16px;
            margin: 12px 0;
            color: #718096;
            font-style: italic;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .markdown-content img:hover {
            transform: scale(1.02);
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }

        .markdown-content table th,
        .markdown-content table td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-content table th {
            background: #f7fafc;
            font-weight: 600;
        }

        .markdown-content a {
            color: #4facfe;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        /* 图片尺寸控制按钮 */
        .image-size-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding: 8px;
            background: #f7fafc;
            border-radius: 6px;
        }

        .image-size-btn {
            padding: 8px 16px;
            font-size: 13px;
            background: white;
            border: 1px solid #4facfe;
            color: #4facfe;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .image-size-btn:hover {
            background: #4facfe;
            color: white;
        }

        /* 图片工具提示 */
        .image-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }

        @media (max-width: 1024px) {
            .editor-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            #app > .container > .card .editor-container {
                height: auto;
            }

            .markdown-editor,
            .markdown-preview {
                min-height: 300px;
            }

            .modal-content {
                max-width: 95%;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .markdown-editor,
            .markdown-preview {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>📊 报名系统管理后台</h1>
                <p>高效管理比赛与报名信息</p>
            </div>

            <div class="tabs">
                <button class="tab" :class="{ active: currentTab === 'create' }" @click="currentTab = 'create'">
                    ✨ 创建比赛
                </button>
                <button class="tab" :class="{ active: currentTab === 'manage' }" @click="currentTab = 'manage'">
                    📋 管理报名
                </button>
            </div>

            <!-- 创建比赛 -->
            <div v-if="currentTab === 'create'">
                <div class="card">
                    <h2>创建新比赛</h2>
                    <div class="form-group">
                        <label>🎯 比赛名称 *</label>
                        <input type="text" v-model="newCompetition.name" placeholder="请输入比赛名称">
                    </div>

                    <div class="form-group">
                        <label>📅 报名开始时间 *</label>
                        <div class="datetime-input-wrapper" @click="$refs.startTimeInput.showPicker()">
                            <input type="datetime-local" v-model="newCompetition.startTime" step="1" ref="startTimeInput">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>⏰ 报名结束时间 *</label>
                        <div class="datetime-input-wrapper" @click="$refs.endTimeInput.showPicker()">
                            <input type="datetime-local" v-model="newCompetition.endTime" step="1" ref="endTimeInput">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>🖼️ 比赛 Logo</label>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <input type="file" @change="handleLogoUpload" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" ref="logoInput" style="display: none;">
                            <button type="button" class="image-size-btn" @click="$refs.logoInput.click()">📤 上传Logo</button>
                            <span v-if="logoFileName" style="font-size: 14px; color: #718096;">{{ logoFileName }}</span>
                            <input type="hidden" v-model="newCompetition.logoUrl">
                        </div>
                        <div v-if="newCompetition.logoUrl" style="margin-top: 12px;">
                            <img :src="getLogoUrl(newCompetition.logoUrl)" alt="Logo预览" style="width: 100px; height: 100px; object-fit: contain; border-radius: 8px; border: 2px solid #e2e8f0;">
                        </div>
                        <div v-if="uploadProgress > 0 && uploadProgress < 100" style="margin-top: 8px;">
                            <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;">
                                <div :style="{width: uploadProgress + '%', background: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', height: '100%', transition: 'width 0.3s'}"></div>
                            </div>
                            <p style="font-size: 12px; color: #718096; margin-top: 4px;">上传中... {{ uploadProgress }}%</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>📄 比赛说明（支持 Markdown）</label>
                        <div class="editor-container">
                            <div class="editor-panel">
                                <label>✏️ 编辑</label>
                                <textarea
                                    class="markdown-editor"
                                    v-model="newCompetition.description"
                                    @input="updateCreatePreview"
                                    placeholder="请输入比赛说明（支持 Markdown 语法）...&#10;&#10;# 一级标题&#10;## 二级标题&#10;**粗体** *斜体*&#10;- 列表项&#10;[链接](url)&#10;![图片](url)&#10;&#10;```&#10;代码块&#10;```"
                                ></textarea>
                            </div>
                            <div class="preview-panel">
                                <label>👁️ 预览</label>
                                <div class="markdown-preview markdown-content" v-html="createPreview"></div>
                            </div>
                        </div>
                        <div class="image-size-controls">
                            <button type="button" class="image-size-btn" @click="uploadAndInsertImage">📤 上传图片</button>
                        </div>
                        <p style="font-size: 12px; color: #718096; margin-top: 8px;">支持 Markdown 语法。上传图片后会自动插入为中等尺寸。</p>
                    </div>

                    <div class="form-group">
                        <label>📝 需要收集的信息字段</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item" v-for="(label, field) in fieldOptions" :key="field">
                                <input type="checkbox" v-model="newCompetition.fields[field]" :id="field">
                                <span>{{ label }}</span>
                            </label>
                        </div>
                    </div>

                    <button @click="createCompetition">✅ 确定创建</button>
                </div>
            </div>

            <!-- 管理报名 -->
            <div v-if="currentTab === 'manage'">
                <div class="card">
                    <h2>选择比赛</h2>
                    <div class="competition-list" v-if="competitions.length > 0">
                        <div class="competition-item"
                             v-for="comp in competitions"
                             :key="comp.id"
                             :class="{ 'hidden-competition': !comp.visible }">
                            <div style="display: flex; gap: 16px; align-items: start;">
                                <div v-if="comp.logo_url" style="flex-shrink: 0;">
                                    <img :src="getLogoUrl(comp.logo_url)" :alt="comp.name" style="width: 80px; height: 80px; object-fit: contain; border-radius: 8px; border: 2px solid #e2e8f0;">
                                </div>
                                <div style="flex: 1;">
                                    <h3>
                                        {{ comp.name }}
                                        <span v-if="!comp.visible" style="font-size: 12px; background: #f56565; color: white; padding: 2px 8px; border-radius: 4px; margin-left: 8px;">已隐藏</span>
                                    </h3>
                                    <p>📅 开始: {{ formatDate(comp.start_time) }}</p>
                                    <p>⏰ 结束: {{ formatDate(comp.end_time) }}</p>
                                </div>
                            </div>
                            <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                                <button @click="manageRegistrations(comp)" style="padding: 8px 16px; font-size: 14px;">
                                    📋 管理报名
                                </button>
                                <button @click.stop="editCompetition(comp)" class="secondary" style="padding: 6px 12px; font-size: 12px;">
                                    ✏️ 编辑
                                </button>
                                <button @click.stop="toggleVisibility(comp)" :class="comp.visible ? 'secondary' : 'success'" style="padding: 6px 12px; font-size: 12px;">
                                    {{ comp.visible ? '👁️ 隐藏' : '👁️ 显示' }}
                                </button>
                                <button class="danger" @click.stop="deleteCompetition(comp)" style="padding: 6px 12px; font-size: 12px;">
                                    🗑️ 删除
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="empty-state" v-else>
                        <p>暂无比赛，请先创建比赛 📝</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentTab: 'manage',
                    competitions: [],
                    newCompetition: {
                        name: '',
                        startTime: '',
                        endTime: '',
                        logoUrl: '',
                        description: '',
                        fields: {
                            name: true,
                            class: false,
                            college: false,
                            student_id: false,
                            gender: false,
                            shirt_size: false,
                            team_name: false,
                            qq: false
                        }
                    },
                    fieldOptions: {
                        name: '👤 姓名',
                        class: '🏫 班级',
                        college: '🎓 学院',
                        student_id: '🆔 学号',
                        gender: '⚧️ 性别',
                        shirt_size: '👕 衬衫大小',
                        team_name: '👥 队伍名称',
                        qq: '💬 联系方式QQ'
                    },
                    editingReg: null,
                    logoFileName: '',
                    uploadProgress: 0,
                    createPreview: '',
                    lastUploadedImageUrl: ''
                }
            },
            watch: {
                currentTab(newTab) {
                    if (newTab === 'create') {
                        this.$nextTick(() => {
                            this.updateCreatePreview()
                        })
                    }
                }
            },
            methods: {
                // Markdown 预览更新
                updateCreatePreview() {
                    this.createPreview = this.renderMarkdown(this.newCompetition.description)
                },
                renderMarkdown(content) {
                    if (!content) return ''
                    try {
                        // 预处理：将带尺寸的图片直接转换为 HTML
                        // 匹配：![alt](url){ width="xxx" }
                        let processedContent = content.replace(
                            /!\[([^\]]*)\]\(([^)]+)\)\s*\{\s*width\s*=\s*["']([^"'%]+%?)["']\s*\}/g,
                            (match, alt, url, width) => {
                                // 如果 width 不带 %，加上 px
                                const normalizedWidth = width.includes('%') ? width : (width.includes('px') ? width : width + 'px')
                                // 直接生成 HTML，不再使用 Markdown
                                return `<img src="${url}" alt="${alt}" style="width: ${normalizedWidth}; max-width: 100%; height: auto;" class="marked-image">`
                            }
                        )

                        // 配置 marked
                        marked.setOptions({
                            breaks: true,
                            gfm: true,
                            highlight: function(code, lang) {
                                if (lang && hljs.getLanguage(lang)) {
                                    try {
                                        return hljs.highlight(code, { language: lang }).value
                                    } catch (err) {}
                                }
                                return hljs.highlightAuto(code).value
                            }
                        })

                        const result = marked.parse(processedContent)
                        return result
                    } catch (error) {
                        return content
                    }
                },
                // 插入图片模板
                insertImageTemplate(size) {
                    if (!this.lastUploadedImageUrl) {
                        alert('请先上传图片')
                        return
                    }

                    const sizes = {
                        small: '{ width="300px" }',
                        medium: '{ width="600px" }',
                        large: '{ width="100%" }'
                    }

                    const imageMd = `![图片](${this.lastUploadedImageUrl})${sizes[size]}\n`
                    this.newCompetition.description += imageMd
                    this.updateCreatePreview()
                },
                // 上传并插入图片
                async uploadAndInsertImage() {
                    const input = document.createElement('input')
                    input.setAttribute('type', 'file')
                    input.setAttribute('accept', 'image/*')
                    input.click()

                    input.onchange = async () => {
                        const file = input.files[0]
                        if (!file) return

                        const formData = new FormData()
                        formData.append('image', file)

                        try {
                            const response = await axios.post('/registration-api/api/upload/image', formData)
                            this.lastUploadedImageUrl = '/registration-api' + response.data.url
                            // 默认插入中等尺寸
                            const imageMd = `![图片](${this.lastUploadedImageUrl}){ width="600px" }\n`
                            this.newCompetition.description += imageMd
                            this.updateCreatePreview()
                        } catch (error) {
                            alert('图片上传失败，请重试')
                        }
                    }
                },
                async loadCompetitions() {
                    try {
                        const response = await axios.get('/registration-api/api/competitions?show_hidden=true')
                        this.competitions = response.data || []
                    } catch (error) {
                        this.competitions = []
                        alert('加载比赛列表失败')
                    }
                },
                async createCompetition() {
                    if (!this.newCompetition.name || !this.newCompetition.startTime || !this.newCompetition.endTime) {
                        alert('请填写完整信息')
                        return
                    }

                    const fields = JSON.stringify(this.newCompetition.fields)

                    // 确保时间格式正确（添加秒数和中国时区 +08:00）
                    const formatTime = (time) => {
                        if (!time) return ''

                        // datetime-local 可能返回: "2026-01-02T17:26" 或 "2026-01-02T17:26:30"
                        // 需要转换为: "2026-01-02T17:26:00+08:00" 或 "2026-01-02T17:26:30+08:00"

                        const parts = time.split('T')
                        if (parts.length !== 2) return time

                        const timePart = parts[1]
                        // 如果只有 "HH:mm"，添加 ":00"
                        // 如果是 "HH:mm:ss"，保持不变
                        // 最后添加时区 "+08:00"
                        if (timePart.length === 5) {  // "HH:mm"
                            return time + ':00+08:00'
                        } else if (timePart.length === 8) {  // "HH:mm:ss"
                            return time + '+08:00'
                        }

                        return time
                    }

                    const payload = {
                        name: this.newCompetition.name,
                        start_time: formatTime(this.newCompetition.startTime),
                        end_time: formatTime(this.newCompetition.endTime),
                        fields: fields,
                        logo_url: this.newCompetition.logoUrl || '',
                        description: this.newCompetition.description || '',
                        visible: true
                    }

                    try {
                        const response = await axios.post('/registration-api/api/competitions', payload)

                        this.newCompetition.name = ''
                        this.newCompetition.startTime = ''
                        this.newCompetition.endTime = ''
                        this.newCompetition.logoUrl = ''
                        this.newCompetition.description = ''
                        this.createPreview = ''
                        this.lastUploadedImageUrl = ''
                        for (let field in this.newCompetition.fields) {
                            if (field !== 'name') {
                                this.newCompetition.fields[field] = false
                            } else {
                                this.newCompetition.fields[field] = true
                            }
                        }
                        this.loadCompetitions()
                    } catch (error) {
                        alert('创建比赛失败')
                        console.error(error)
                    }
                },
                async toggleVisibility(comp) {
                    try {
                        await axios.put(`/registration-api/api/competitions/${comp.id}/visibility`, {
                            visible: !comp.visible
                        })
                        alert(!comp.visible ? '✅ 比赛已显示' : '✅ 比赛已隐藏')
                        await this.loadCompetitions()
                    } catch (error) {
                        alert('操作失败')
                    }
                },
                editCompetition(comp) {
                    // 跳转到独立的编辑页面
                    window.location.href = `admin-edit-competition.html?id=${comp.id}`
                },
                async deleteCompetition(comp) {
                    if (!confirm(`确定要删除比赛"${comp.name}"吗？\n\n此操作将删除该比赛及其所有报名记录，且无法恢复！`)) {
                        return
                    }

                    try {
                        await axios.delete(`/registration-api/api/competitions/${comp.id}`)
                        this.competitions = this.competitions.filter(c => c.id !== comp.id)
                        if (this.selectedCompetition && this.selectedCompetition.id === comp.id) {
                            this.selectedCompetition = null
                            this.registrations = []
                        }
                    } catch (error) {
                        alert('删除失败')
                    }
                },
                formatDate(dateStr) {
                    if (!dateStr) return ''
                    const date = new Date(dateStr)
                    return date.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false,
                        timeZone: 'Asia/Shanghai'
                    })
                },
                async handleLogoUpload(event) {
                    const file = event.target.files[0]
                    if (!file) return

                    this.logoFileName = file.name
                    this.uploadProgress = 0

                    const formData = new FormData()
                    formData.append('image', file)

                    try {
                        const response = await axios.post('/registration-api/api/upload/image', formData, {
                            onUploadProgress: (progressEvent) => {
                                this.uploadProgress = Math.round((progressEvent.loaded * 100) / progressEvent.total)
                            }
                        })

                        this.newCompetition.logoUrl = response.data.url
                    } catch (error) {
                        alert('Logo上传失败，请重试')
                        this.logoFileName = ''
                        this.uploadProgress = 0
                    }
                },
                getLogoUrl(url) {
                    if (!url) return ''
                    if (url.startsWith('http://') || url.startsWith('https://')) {
                        return url
                    }
                    return '/registration-api' + url
                },
                manageRegistrations(comp) {
                    window.location.href = `admin-registrations.html?id=${comp.id}`
                }
            },
            mounted() {
                this.loadCompetitions()
                // 从 URL hash 读取标签
                const hash = window.location.hash
                if (hash === '#create') {
                    this.currentTab = 'create'
                } else if (hash === '#manage' || hash === '') {
                    this.currentTab = 'manage'
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
