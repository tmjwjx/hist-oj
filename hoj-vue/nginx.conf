user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 允许上传大文件（测试用例压缩包可能很大）
        client_max_body_size 300M;

        # 所有 API 统一代理到 Java 主后端
        location /api {
            resolver 127.0.0.11 valid=30s;
            set $backend "hoj-backend:6688";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        # 前端路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 课堂文件由 Java 主后端统一鉴权和返回
        location /uploads {
            # 验证Referer - 防止直接URL访问和外部引用
            valid_referers none blocked server_names bingoj.cn *.bingoj.cn;
            if ($invalid_referer) {
                return 403;
            }

            proxy_pass http://hoj-backend:6688;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer $http_referer;

            # 安全响应头：防止直接下载
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self' https://bingoj.cn;" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;

            # 确保PDF文件有正确的Content-Type
            types {
                application/pdf pdf;
            }
        }

        # 静态资源缓存（排除 /uploads、/api 路径下的资源）

        # JS/CSS 文件 - 使用长期缓存（文件名包含哈希，内容变化时文件名自动改变）
        location ~* ^/(?!uploads|api).*\.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 字体文件 - 使用长期缓存（文件名包含哈希）
        location ~* ^/(?!uploads|api).*\.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 图片等静态资源使用较长缓存
        location ~* ^/(?!uploads|api).*\.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML 文件 - 禁用缓存，确保总是获取最新版本
        location ~* ^/(?!uploads|api).*\.html$ {
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
