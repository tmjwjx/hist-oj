user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 允许上传大文件（测试用例压缩包可能很大）
        client_max_body_size 300M;

        # 报名系统 API 代理（放在最前面，确保优先匹配）
        # 前端请求:
        #   /registration-api/api/xxx -> 后端: /api/xxx
        #   /registration-api/uploads/xxx -> 后端: /uploads/xxx
        location /registration-api/ {
            # 重写路径：
            # /registration-api/api/xxx -> /api/xxx
            # /registration-api/uploads/xxx -> /uploads/xxx
            rewrite ^/registration-api/(api|uploads)/(.*)$ /$1/$2 break;

            # 直接代理，不使用变量（避免 resolver 问题）
            proxy_pass http://registration-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 添加 CORS 头
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            # 图片缓存
            if ($request_uri ~* "^/uploads/") {
                expires 30d;
                add_header Cache-Control "public";
            }
        }

        # Judge API 代理到 hist-oj 服务（判题终端）
        location /judge-api {
            resolver 127.0.0.11 valid=30s;
            set $judge_backend "hist-oj:9527";
            # 重写路径：/judge-api/xxx -> /api/judge/xxx
            rewrite ^/judge-api/(.*)$ /api/judge/$1 break;
            proxy_pass http://$judge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;  # 传递 BingOJ Token
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 判题可能需要更长时间
            proxy_buffering off;  # 禁用缓冲以支持 SSE
        }

        # Rating API 代理到 hist-oj 服务
        location /api/rating {
            resolver 127.0.0.11 valid=30s;
            set $rating_backend "hist-oj:9527";
            proxy_pass http://$rating_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Classroom API 代理到 hist-oj 服务
        location /api/classroom {
            resolver 127.0.0.11 valid=30s;
            set $classroom_backend "hist-oj:9527";
            proxy_pass http://$classroom_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Battle API 代理到 hist-oj 服务
        location /battle-api/ {
            # 重写路径：/battle-api/xxx -> /api/xxx
            rewrite ^/battle-api/(.*)$ /api/$1 break;

            # 直接代理，不使用变量（避免 resolver 问题）
            proxy_pass http://hist-oj:9527;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Rating API 代理到 hist-oj 服务（前端 /rating-api 前缀）
        location /rating-api/ {
            # 重写路径：/rating-api/api/xxx -> /api/xxx
            rewrite ^/rating-api/(.*)$ /$1 break;

            # 直接代理到 hist-oj 容器
            proxy_pass http://hist-oj:9527;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API 代理到 HOJ 后端（排除 /api/battle、/api/rating、/api/judge、/api/classroom）
        location /api {
            # Battle API 单独代理到 hist-oj
            location ~ ^/api/battle {
                proxy_pass http://hist-oj:9527;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Rating API 单独代理到 hist-oj
            location ~ ^/api/rating {
                proxy_pass http://hist-oj:9527;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Judge API 单独代理到 hist-oj
            location ~ ^/api/judge {
                proxy_pass http://hist-oj:9527;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
            }

            # Classroom API 单独代理到 hist-oj
            location ~ ^/api/classroom {
                proxy_pass http://hist-oj:9527;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 其他 API 代理到 hoj-backend
            resolver 127.0.0.11 valid=30s;
            set $backend "hoj-backend:6688";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 前端路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 文件下载代理到 hist-oj
        location /uploads {
            proxy_pass http://hist-oj:9527;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源缓存（排除 /uploads、/api、/registration 路径下的资源）

        # JS/CSS 文件 - 使用长期缓存（文件名包含哈希，内容变化时文件名自动改变）
        location ~* ^/(?!uploads|api|registration).*\.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 字体文件 - 使用长期缓存（文件名包含哈希）
        location ~* ^/(?!uploads|api|registration).*\.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 图片等静态资源使用较长缓存
        location ~* ^/(?!uploads|api|registration).*\.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML 文件 - 禁用缓存，确保总是获取最新版本
        location ~* ^/(?!uploads|api|registration).*\.html$ {
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
