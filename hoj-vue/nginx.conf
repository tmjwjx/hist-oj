user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 允许上传大文件（测试用例压缩包可能很大）
        client_max_body_size 300M;

        # 报名系统 API 代理（放在最前面，确保优先匹配）
        # 前端请求:
        #   /registration-api/api/xxx -> 后端: /api/xxx
        #   /registration-api/uploads/xxx -> 后端: /uploads/xxx
        location /registration-api/ {
            # 处理 OPTIONS 请求（CORS 预检）
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # 重写路径：
            # /registration-api/api/xxx -> /api/xxx
            # /registration-api/uploads/xxx -> /uploads/xxx
            rewrite ^/registration-api/(api|uploads)/(.*)$ /$1/$2 break;

            # 直接使用容器名和端口，不使用变量
            proxy_pass http://registration-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 添加 CORS 头
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            # 图片缓存
            if ($request_uri ~* "^/uploads/") {
                expires 30d;
                add_header Cache-Control "public";
            }
        }

        # 报名系统上传的图片文件（直接访问路径，用于向后兼容）
        location /uploads {
            proxy_pass http://registration-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Judge API 代理到 hist-oj 服务（判题终端）
        location /judge-api {
            resolver 127.0.0.11 valid=30s;
            set $judge_backend "hist-oj:9527";
            # 重写路径：/judge-api/xxx -> /api/judge/xxx
            rewrite ^/judge-api/(.*)$ /api/judge/$1 break;
            proxy_pass http://$judge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 判题可能需要更长时间
            proxy_buffering off;  # 禁用缓冲以支持 SSE
        }

        # Rating API 代理到 hist-oj 服务
        location /api/rating {
            resolver 127.0.0.11 valid=30s;
            set $rating_backend "hist-oj:9527";
            proxy_pass http://$rating_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API 代理到 HOJ 后端
        location /api {
            # 使用变量方式，让 Nginx 在运行时解析域名
            resolver 127.0.0.11 valid=30s;
            set $backend "hoj-backend:6688";
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 前端路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（排除 /uploads、/api、/registration 路径下的资源）
        # 字体文件使用较短缓存时间，避免更新后浏览器不刷新
        location ~* ^/(?!uploads|api|registration).*\.(woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # 其他静态资源使用较长缓存
        location ~* ^/(?!uploads|api|registration).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
