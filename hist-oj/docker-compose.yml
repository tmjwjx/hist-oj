services:
  hist-oj:
    build: .
    image: hist-oj:latest
    container_name: hist-oj
    ports:
      - "8080:8080"
    environment:
      # 服务配置
      - SERVER_PORT=8080

      # 数据库配置（连接 HOJ 现有的 MySQL）
      - DATABASE_HOST=<---HOJ数据库地址，如果同一docker网络填容器名，否则填IP--->
      - DATABASE_PORT=3306
      - DATABASE_USER=<---数据库用户名--->
      - DATABASE_PASSWORD=<---数据库密码--->
      - DATABASE_DBNAME=hoj

      # HOJ 后端 API 地址
      - HOJ_API_BASE_URL=<---HOJ后端地址，如 http://hoj-backend:6688--->

      # JWT 配置（必须与 HOJ 的 jwt-token-secret 一致）
      - JWT_SECRET=<---与HOJ一致的JWT密钥--->

      # Rating 配置（可选，有默认值）
      - RATING_INITIAL_RATING=1500
      - RATING_K_FACTOR=32
      - RATING_CHECK_INTERVAL=5

    # 如果 HOJ 使用 docker 部署，需要加入同一网络
    networks:
      - <---HOJ的docker网络名--->

    restart: unless-stopped

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  <---HOJ的docker网络名--->:
    external: true
