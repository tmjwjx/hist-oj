# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name bingoj.cn www.bingoj.cn;

    # Let's Encrypt 验证路径（如果使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name bingoj.cn www.bingoj.cn;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/bingoj.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/bingoj.cn.key;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 允许摄像头权限（班级签到功能必需）
    add_header Permissions-Policy "camera=self, microphone=self, geolocation=(self)" always;

    # 日志
    access_log /var/log/nginx/bingoj_access.log;
    error_log /var/log/nginx/bingoj_error.log;

    # 客户端上传大小限制
    client_max_body_size 100M;
    client_body_timeout 60s;

    # 反向代理到 Docker 容器（hoj-frontend）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（实时功能需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # hist-oj API 代理（端口 9527）
    location /api/hist-oj/ {
        proxy_pass http://127.0.0.1:9527/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（判题可能需要更长时间）
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 代码查重 API 代理（端口 9527）
    location /api/plagiarism/ {
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（查重可能需要较长时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 代码查重 API 代理 - 前端开发路径（端口 9527）
    location /plagiarism-api/ {
        # 使用 URI 重写，去掉 /plagiarism-api 前缀
        rewrite ^/plagiarism-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（查重可能需要较长时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 报名系统 API 代理
    # 前端请求 /registration-api/api/xxx
    # Nginx 转发到 http://127.0.0.1:8080/api/xxx
    location /registration-api/ {
        # 使用 URI 重写，去掉 /registration-api 前缀
        rewrite ^/registration-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rating系统 API 代理
    # 前端请求 /rating-api/api/xxx
    # Nginx 转发到 http://127.0.0.1:9527/api/xxx
    location /rating-api/ {
        # 使用 URI 重写，去掉 /rating-api 前缀
        rewrite ^/rating-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 对战系统 API 代理
    # 前端请求 /battle-api/api/xxx
    # Nginx 转发到 http://127.0.0.1:9527/api/xxx
    location /battle-api/ {
        # 使用 URI 重写，去掉 /battle-api 前缀
        rewrite ^/battle-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 班级系统 API 代理
    # 前端请求 /classroom-api/api/xxx
    # Nginx 转发到 http://127.0.0.1:9527/api/xxx
    location /classroom-api/ {
        # 使用 URI 重写，去掉 /classroom-api 前缀
        rewrite ^/classroom-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 文件上传路径代理到 hist-oj 后端
    location /uploads {
        # 代理到 hist-oj 后端服务（端口 9527）
        proxy_pass http://127.0.0.1:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $http_referer;

        # 禁用缓存，确保权限检查每次都执行
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;

        # 确保PDF文件有正确的Content-Type
        types {
            application/pdf pdf;
        }
    }

    # 注意：主要的 /api/ 请求由前端容器内部处理，通过 Docker 网络代理到 hist-oj
    # 宿主机 Nginx 只需要将请求转发到前端容器即可
}
