# 首页热点接口微缓存（仅匿名全局只读数据；http 上下文）
# 比赛开赛瞬间 400 人的首页突发请求在此合并回源，保护 2 核后端
proxy_cache_path /var/cache/nginx/hoj_api levels=1:2 keys_zone=hoj_api:10m
                 max_size=100m inactive=30m use_temp_path=off;

# 本地压测页只请求匿名页面/资源；已有上游 CORS 头时不重复添加。
map $upstream_http_access_control_allow_origin $queue_acao {
    default "";
    "" "*";
}

# 普通刷新可复用已完成加载的凭据；强制无缓存或版本变化必须重新冷加载。
map "$http_cache_control|$http_pragma|$arg_hoj_cold" $queue_force_cold {
    default "0";
    "~*no-cache" "1";
    "~\|1$" "1";
}

# 排队控制请求直达后端，复用连接，不再经过前端容器。
upstream hoj_queue_backend {
    server 127.0.0.1:6688;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name bingoj.cn www.bingoj.cn;

    # Let's Encrypt 验证路径（如果使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name bingoj.cn www.bingoj.cn;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/bingoj.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/bingoj.cn.key;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 允许摄像头权限（班级签到功能必需）
    add_header Permissions-Policy "camera=self, microphone=self, geolocation=(self)" always;

    # 匿名页面和静态资源允许本地压测读取；API 保留上游 CORS 策略
    add_header Access-Control-Allow-Origin $queue_acao always;

    # 日志
    access_log /var/log/nginx/bingoj_access.log;
    error_log /var/log/nginx/bingoj_error.log;

    # 客户端上传大小限制
    client_max_body_size 200M;
    client_body_timeout 60s;

    # 反向代理到 Docker 容器（hoj-frontend）
    # 白名单接口微缓存：仅全局只读、与用户无关的匿名接口（10 秒 TTL，过期后第一个请求回源，
    # 期间其余请求直接命中缓存）。其余 API 一律不缓存，照常透传。
    location ~* ^/api/(get-website-config|home-carousel|get-recent-contest|rating/rank)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 这四个接口为匿名只读数据，忽略后端的 Set-Cookie / Cache-Control / Vary，
        # 否则 nginx 会因 JSESSIONID 而拒绝缓存
        proxy_ignore_headers Set-Cookie Cache-Control Vary;
        proxy_hide_header Set-Cookie;
        # 缓存内容与 Origin 无关，避免缓存某次跨域请求的 ACAO 导致其他本地压测来源失败。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_cache hoj_api;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Hoj-Cache $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 冷加载消费一次性票据；已完成加载的浏览器凭据由后端验证后允许普通刷新。
    # auth_request 在 Redis 原子消费 reserved 名额，随后加载生命周期负责续期/释放。
    location = /__queue.html {
        root /var/www/hoj;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /__queue_auth {
        internal;
        proxy_pass http://hoj_queue_backend/api/queue/claim;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Queue-Ticket $queue_ticket;
        proxy_set_header X-Queue-Warm $cookie_hoj_loaded;
        proxy_set_header X-Queue-Force $queue_request_force;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # claim 只供 Nginx 子请求使用；普通客户端通过携票 HTML 导航消费名额。
    location ^~ /api/queue/claim {
        return 404;
    }

    location ^~ /api/queue/ {
        proxy_pass http://hoj_queue_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # 资源请求永不替换成排队 HTML。前端容器对应静态 location 不存在时返回 404。
    location ~* ^/(?!uploads|api).*\.(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico|svg|mjs|map|wasm|json|webp|avif|bmp|jfif|mp3|mp4|ogg|wav|webm)$ {
        proxy_pass http://127.0.0.1:8081;
        # 容器 gzip 默认要求 HTTP/1.1；HTTP/1.0 回源会使静态资源压缩失效。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $queue_ticket $arg_hoj_ticket;
        set $queue_request_force $queue_force_cold;
        auth_request /__queue_auth;
        error_page 401 403 =200 /__queue.html;
        error_page 500 502 503 504 =503 /__queue.html;
        # 通行票据一次有效，HTML 不得被缓存后复用。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $queue_acao always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（实时功能需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 文件上传和课堂资源由 Java 主后端统一处理
    location /uploads {
        proxy_pass http://127.0.0.1:6688;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $http_referer;

        # 禁用缓存，确保权限检查每次都执行
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;

        # 确保PDF文件有正确的Content-Type
        types {
            application/pdf pdf;
        }
    }

    # 主要的 /api/ 请求由前端容器转发到 Java 主后端
    # 宿主机 Nginx 只需要将请求转发到前端容器即可
}
