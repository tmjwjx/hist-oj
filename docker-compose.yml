services:
  # 前端服务
  hoj-frontend:
    build:
      context: ./hoj-vue
      dockerfile: Dockerfile
    container_name: hoj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # Logo 映射（前端logo、后台logo、网站图标）
      - ./logo.png:/usr/share/nginx/html/assets/img/logo.a0feb5a8.png
      - ./backstage.png:/usr/share/nginx/html/assets/img/backstage.a0feb5a8.png
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico
    networks:
      - hoj-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hoj-network:
    external: true
    name: hoj_hoj-network

# 部署说明：
# 1. 本地测试：docker-compose up -d
# 2. 生产部署：./scripts/deploy.sh
#
# 注意事项：
# - 确保 hoj_hoj-network 网络已存在
# - 前端 Nginx 配置：./hoj-vue/nginx.conf
#
# 验证部署：
# - curl http://localhost/api/rating/contest/info/1002  # Java 主后端
