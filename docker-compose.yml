version: '3.8'

services:
  # hist-oj Rating 服务
  hist-oj:
    build:
      context: ./hist-oj
      dockerfile: Dockerfile
    container_name: hist-oj
    restart: unless-stopped
    ports:
      - "9527:9527"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./hist-oj/configs:/app/configs:ro
      - ./hist-oj/uploads:/app/uploads  # 持久化上传文件(班级作业图片、消息图片等)
    networks:
      - hoj-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9527/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 报名系统后端服务
  registration-backend:
    build:
      context: ./registration-system/backend
      dockerfile: Dockerfile
    container_name: registration-backend
    restart: unless-stopped
    environment:
      # 数据库配置
      - DATABASE_HOST=43.143.133.62
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=hist2025
      - DATABASE_DBNAME=hoj
      # 服务配置
      - SERVER_PORT=8080
      - TZ=Asia/Shanghai
    volumes:
      - ./registration-system/backend/uploads:/app/uploads  # 持久化上传文件
    networks:
      - hoj-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/competitions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务（集成 Rating 和报名系统）
  hoj-frontend:
    build:
      context: ./hoj-vue
      dockerfile: Dockerfile
    container_name: hoj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # Logo 映射（前端logo、后台logo、网站图标）
      - ./logo.png:/usr/share/nginx/html/assets/img/logo.a0feb5a8.png
      - ./backstage.png:/usr/share/nginx/html/assets/img/backstage.a0feb5a8.png
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico
    depends_on:
      - hist-oj
      - registration-backend
    networks:
      - hoj-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hoj-network:
    external: true
    name: hoj_hoj-network

# 部署说明：
# 1. 本地测试：docker-compose up -d
# 2. 生产部署：./scripts/deploy.sh
# 3. 快速部署：./scripts/quick-deploy.sh [hist-oj|registration|frontend|all]
#
# 注意事项：
# - 确保 hoj_hoj-network 网络已存在
# - hist-oj 配置文件：./hist-oj/configs/config.yaml
# - 报名系统配置：通过环境变量配置
# - 前端 Nginx 配置：./hoj-vue/nginx.conf
#
# 验证部署：
# - curl http://localhost:9527/health
# - curl http://localhost/api/rating/contest/info/1002
# - curl http://localhost/registration-api/competitions
