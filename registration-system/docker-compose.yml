version: '3.8'

services:
  # 报名系统后端服务
  registration-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: registration-backend:latest
    container_name: registration-backend
    ports:
      - "127.0.0.1:8080:8080"  # 只绑定到 127.0.0.1，不对外暴露
    environment:
      # 数据库配置
      - DATABASE_HOST=43.143.133.62
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=hist2025
      - DATABASE_DBNAME=hoj

      # 服务配置
      - SERVER_PORT=8080

    volumes:
      - ./backend/uploads:/app/uploads  # 持久化上传文件

    restart: unless-stopped

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/competitions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
